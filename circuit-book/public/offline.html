<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Circuit Book — offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0e1110;
        color: #ecf1ee;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      .wrap {
        max-width: 22rem;
        text-align: left;
      }
      .mark {
        display: flex;
        gap: 5px;
        margin-bottom: 28px;
      }
      .mark span {
        width: 16px;
        height: 30px;
        border-radius: 2px;
        background: #2c3330;
      }
      .mark span:nth-child(1),
      .mark span:nth-child(2) {
        background: #c9ff46;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        font-stretch: 115%;
        letter-spacing: -0.02em;
        margin: 0 0 10px;
      }
      p {
        margin: 0 0 24px;
        color: #8b948f;
        line-height: 1.55;
        font-size: 0.975rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        background: #c9ff46;
        color: #0e1110;
        font: inherit;
        font-weight: 650;
        padding: 14px 20px;
        width: 100%;
        min-height: 48px;
      }
      button:active {
        background: #8fbf1f;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <h1>No connection</h1>
      <p>
        Stations you already ticked off are saved on this phone and will sync as soon as you
        are back on a network. Open the app again to pick up where you left off.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
