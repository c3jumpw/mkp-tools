<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HatRack</title>
<meta name="description" content="HatRack — a lightweight visual sorter for entrepreneurs who wear many hats. Paste long to-do lists, sort them onto your businesses, projects and personal life, and export them to your task app.">
<meta name="theme-color" content="#1E6B52">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HatRack">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='28' height='3' rx='1.5' fill='%2364748B'/%3E%3Cpath d='M16 7v4' stroke='%2364748B' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M8 22c0-6 3.6-9.5 8-9.5s8 3.5 8 9.5z' fill='%231E6B52'/%3E%3Cellipse cx='16' cy='23' rx='12.5' ry='3.4' fill='%231E6B52'/%3E%3Cpath d='M8.4 19.4h15.2' stroke='%23D9961A' stroke-width='2.2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
/* ============ HatRack — styles ============ */
:root{
  --bg:#E8ECF0; --panel:#DFE5EB; --surface:#FFFFFF; --chip:#EEF1F4;
  --ink:#17202B; --ink2:#3F4A59; --muted:#677385;
  --line:#CDD5DE; --line2:#E2E7ED;
  --accent:#1E6B52; --accent-ink:#FFFFFF; --accent-soft:#D6EBE2;
  --hl:#D9961A; --hl-soft:#FBEBC8;
  --danger:#B42318; --danger-soft:#FBE4E1;
  --shadow:0 1px 0 rgba(23,32,43,.05),0 1px 3px rgba(23,32,43,.10);
  --shadow-lg:0 12px 40px rgba(23,32,43,.18);
  --font-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Bricolage Grotesque",var(--font-ui);
  --colw:292px;
  --tint-red:#FCE3E0; --tint-orange:#FDE7D2; --tint-yellow:#FAF0C2; --tint-green:#DCF0E2; --tint-teal:#D3EEEE;
  --tint-blue:#DCE8F8; --tint-purple:#E9E1F7; --tint-pink:#F8E0EB; --tint-gray:#E5E8EC;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151B; --panel:#171E26; --surface:#1E2731; --chip:#26313D;
    --ink:#E5EAF0; --ink2:#B9C3CF; --muted:#8C98A8;
    --line:#2E3A47; --line2:#26313C;
    --accent:#47B08A; --accent-ink:#0B1A14; --accent-soft:#173A2E;
    --hl:#E7B040; --hl-soft:#3A2F14;
    --danger:#F0705F; --danger-soft:#3D1F1B;
    --shadow:0 1px 0 rgba(0,0,0,.25),0 1px 3px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.5);
    --tint-red:#3B2321; --tint-orange:#3B2918; --tint-yellow:#373018; --tint-green:#1B3226; --tint-teal:#163233;
    --tint-blue:#1A2B40; --tint-purple:#2A2240; --tint-pink:#38202D; --tint-gray:#29313B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151B; --panel:#171E26; --surface:#1E2731; --chip:#26313D;
  --ink:#E5EAF0; --ink2:#B9C3CF; --muted:#8C98A8;
  --line:#2E3A47; --line2:#26313C;
  --accent:#47B08A; --accent-ink:#0B1A14; --accent-soft:#173A2E;
  --hl:#E7B040; --hl-soft:#3A2F14;
  --danger:#F0705F; --danger-soft:#3D1F1B;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 1px 3px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  --tint-red:#3B2321; --tint-orange:#3B2918; --tint-yellow:#373018; --tint-green:#1B3226; --tint-teal:#163233;
  --tint-blue:#1A2B40; --tint-purple:#2A2240; --tint-pink:#38202D; --tint-gray:#29313B;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.sm{font-size:13px}
kbd{font:12px/1 var(--font-ui);background:var(--chip);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--ink2)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;line-height:1.2;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--chip)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.icon-btn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--ink2);font-size:16px;line-height:1}
.icon-btn:hover{background:var(--chip);color:var(--ink)}
.icon-btn.sm{width:26px;height:26px;font-size:14px}
.inp,select.inp{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px;min-width:0;line-height:1.25}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea.inp{resize:vertical;width:100%;line-height:1.45}
select.inp{padding-right:26px}
input[type="color"]{width:30px;height:30px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--surface);cursor:pointer}
input[type="checkbox"]{accent-color:var(--accent);width:16px;height:16px}
label.chk{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:13px;color:var(--muted)}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font:700 21px/1 var(--font-display);letter-spacing:-.02em;color:var(--ink);text-decoration:none;margin-right:6px}
.brand svg{flex:none}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;color:var(--ink2)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--ink);font-weight:700}
.quick{flex:1;min-width:220px;display:flex;align-items:center;position:relative}
.quick input{width:100%;padding-left:32px}
.quick::before{content:"+";position:absolute;left:11px;top:50%;transform:translateY(-52%);font-size:19px;color:var(--muted);pointer-events:none}
.top-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:8px 12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap;font-size:14px}
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font:600 16px/1.2 var(--font-display);margin-right:6px}
.crumbs button{border:0;background:none;padding:3px 6px;border-radius:6px;color:var(--ink2)}
.crumbs button:hover{background:var(--chip);color:var(--ink)}
.crumbs button.here{color:var(--ink)}
.crumbs .sep{color:var(--muted);padding:0 1px}
.crumbs .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:1px}
.tb-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tb-group label{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.tb-group select.inp,.tb-group input.inp{padding:4px 8px;font-size:14px}
.tb-sep{width:1px;height:22px;background:var(--line)}
.tb-search{width:140px}
.tb-group select.inp{max-width:124px}
.tb-ftoggle{display:none}
.spacer{flex:1}

/* ---------- main ---------- */
main#view{flex:1;min-height:0;overflow:auto;position:relative}

/* ---------- board ---------- */
.board{display:inline-flex;flex-direction:column;min-width:100%;padding:0 14px 140px}
.board-row{display:grid;grid-template-columns:repeat(var(--ncols),var(--colw));gap:12px;align-items:start}
.board-head{position:sticky;top:0;z-index:6;background:var(--bg);padding:12px 0 8px}
.col-head{position:relative;background:var(--surface);border-radius:10px;padding:9px 8px 8px 12px;box-shadow:var(--shadow);border-top:4px solid var(--c,var(--line));min-height:58px;display:flex;flex-direction:column;gap:2px}
.col-head.inbox{border-top-style:dashed}
.col-title{display:flex;align-items:center;gap:6px;min-width:0;padding-right:58px}
.col-name{border:0;background:none;padding:0;font:700 15.5px/1.2 var(--font-display);text-align:left;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
button.col-name.drill:hover{text-decoration:underline;text-decoration-color:var(--c,var(--muted));text-underline-offset:3px}
.col-n{font-size:13px;color:var(--muted);flex:none}
.col-meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.col-tools{position:absolute;top:6px;right:6px;display:flex;gap:2px;align-items:center}
.col-key{font-size:11px;min-width:18px;text-align:center}
.lane{margin-top:14px}
.lane-head{position:sticky;left:14px;display:inline-flex;align-items:center;gap:8px;padding:2px 2px 6px;font:700 14px/1.2 var(--font-display);color:var(--ink2)}
.lane-head .sw{width:10px;height:10px;border-radius:3px;background:var(--c,var(--muted))}
.lane-head .muted{font:400 13px var(--font-ui)}
.cell{background:var(--panel);border-radius:10px;min-height:70px;padding:7px;display:flex;flex-direction:column;gap:6px;transition:background .1s}
.cell.is-over{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px}
.cell.nodrop{background:repeating-linear-gradient(135deg,var(--panel) 0 8px,transparent 8px 16px)}
.add-inline{border:1px dashed transparent;background:transparent;color:var(--muted);text-align:left;padding:5px 8px;border-radius:7px;font-size:13.5px}
.cell:hover .add-inline{border-color:var(--line)}
.add-inline:hover{color:var(--ink);background:var(--surface)}
.cell .inline-inp{width:100%}
.drop-ph{height:4px;border-radius:2px;background:var(--accent);margin:-2px 0;flex:none}
.col-add{display:flex;align-items:flex-start}
.col-add .btn{width:100%;justify-content:center;border-style:dashed;background:transparent;min-height:58px;color:var(--muted)}
.col-add .btn:hover{color:var(--ink);background:var(--surface)}

/* coat-check tag card */
.card{position:relative;background:var(--cbg,var(--surface));border-radius:8px;padding:8px 9px 8px 22px;box-shadow:var(--shadow);cursor:grab;border:1px solid transparent;user-select:none;-webkit-user-select:none}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:8px 0 0 8px;background:var(--tag,var(--line))}
.card::after{content:"";position:absolute;left:10px;top:12px;width:6px;height:6px;border-radius:50%;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.card:hover{border-color:var(--line)}
.card.is-sel{border-color:var(--hl);box-shadow:0 0 0 2px var(--hl-soft),var(--shadow)}
.card.is-dragging{opacity:.35}
.card.is-done .card-title{text-decoration:line-through;color:var(--muted)}
.card-title{font-size:14.5px;line-height:1.35;overflow-wrap:anywhere;padding-right:16px}
.card-title .ty{margin-right:5px}
.card-path{font-size:12px;color:var(--muted);margin-top:1px}
.card-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.card-check{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);background:var(--surface);opacity:0;display:grid;place-items:center;font-size:11px;line-height:1;color:var(--accent-ink);padding:0}
.card:hover .card-check,.card.is-sel .card-check{opacity:1}
.card.is-sel .card-check{background:var(--hl);border-color:var(--hl)}
@media (hover:none){.card-check{opacity:1}}
.density-compact .card{padding-top:6px;padding-bottom:6px}
.density-compact .card::after{top:10px}
.density-compact .card-meta{display:none}
.density-compact .card-path{display:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1.3;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--ink2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill .d{width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.pill.over{background:var(--danger-soft);color:var(--danger);font-weight:700}
.pill.today{background:var(--hl-soft);color:var(--ink)}
.pill.seen{background:var(--hl-soft);color:var(--ink);font-weight:700}
.drag-ghost{position:fixed;top:-100px;left:-100px;background:var(--accent);color:var(--accent-ink);padding:6px 12px;border-radius:8px;font-weight:700;box-shadow:var(--shadow-lg)}

/* empty state */
.empty{max-width:640px;margin:8vh auto;padding:28px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);text-align:left}
.empty h2{font:700 28px/1.15 var(--font-display);margin:0 0 8px;letter-spacing:-.02em}
.empty p{margin:0 0 18px;color:var(--ink2)}
.empty .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- selection bar ---------- */
.selbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--surface);border-radius:12px;padding:6px 8px 6px 14px;display:flex;align-items:center;gap:4px;box-shadow:var(--shadow-lg);max-width:calc(100vw - 24px);flex-wrap:wrap}
.selbar .n{font-weight:700;margin-right:6px}
.selbar .btn{background:transparent;border-color:transparent;color:inherit;padding:5px 9px}
.selbar .btn:hover{background:rgba(255,255,255,.14)}
:root[data-theme="dark"] .selbar .btn:hover{background:rgba(0,0,0,.1)}

/* ---------- menus / popovers ---------- */
.menu{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:4px;min-width:200px;max-width:340px;max-height:min(60vh,520px);overflow:auto}
.menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:6px;font-size:14px;color:var(--ink)}
.menu button:hover,.menu button:focus-visible{background:var(--chip);outline:none}
.menu button .sw{width:9px;height:9px;border-radius:3px;flex:none;background:var(--c,transparent)}
.menu .hd{font-size:12px;color:var(--muted);padding:6px 10px 2px}
.menu hr{border:0;border-top:1px solid var(--line2);margin:4px 2px}
.menu input{width:calc(100% - 8px);margin:4px}

/* ---------- drawer (task editor) ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100vw);background:var(--surface);box-shadow:var(--shadow-lg);z-index:50;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.drawer-head .path{flex:1;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-body{flex:1;overflow:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
.drawer-foot{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line2);flex-wrap:wrap}
.title-inp{min-height:34px;font:700 20px/1.25 var(--font-display);border:1px solid transparent;border-radius:8px;padding:6px 8px;margin:-6px -8px 0;resize:none;width:calc(100% + 16px);background:transparent;overflow:hidden}
.title-inp:hover{border-color:var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .inp{width:100%}
.sect h4{margin:0 0 6px;font:700 14px/1.2 var(--font-display);display:flex;align-items:center;gap:8px}
.sect h4 .muted{font:400 13px var(--font-ui)}
.subs{display:flex;flex-direction:column;gap:4px}
.sub{display:grid;grid-template-columns:auto 1fr auto auto auto auto;gap:4px;align-items:center}
.sub .inp{padding:4px 7px}
.sub.done .inp{text-decoration:line-through;color:var(--muted)}
.sub-note{grid-column:2 / -1}
.att{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line2);border-radius:8px}
.att .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atts{display:flex;flex-direction:column;gap:5px}
.meta-line{font-size:12.5px;color:var(--muted)}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(10,14,20,.48);z-index:60;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:14px}
.modal{background:var(--surface);border-radius:14px;width:min(720px,100%);max-height:calc(100vh - 28px);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal.wide{width:min(1180px,100%)}
.modal.tri-modal{width:min(900px,100%)}
.modal:focus{outline:none}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.modal-head h3{margin:0;font:700 21px/1.2 var(--font-display);letter-spacing:-.01em;flex:1}
.modal-body{padding:4px 16px 16px;overflow:auto;flex:1;min-height:0;min-width:0}
.modal-foot{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line2)}
.modal-foot .left{margin-right:auto}

/* import */
.imp{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,1fr);gap:14px}
.imp-text{min-height:260px;height:32vh;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.imp-filebar{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px}
.imp-opts{display:flex;flex-direction:column;gap:9px}
.imp-opts .inp{width:100%}
.imp-checks{display:flex;flex-direction:column;gap:6px;font-size:14px}
.target-chip{display:inline-flex;align-items:center;gap:6px;background:var(--hl-soft);border-radius:999px;padding:3px 6px 3px 10px;font-size:13px;align-self:flex-start}
.imp-sum{margin:14px 0 6px;font-size:14px;display:flex;gap:14px;flex-wrap:wrap}
.imp-sum b{font-family:var(--font-display)}
.cheat{font-size:12.5px;color:var(--ink2);background:var(--chip);border-radius:8px;padding:8px 10px;line-height:1.6}
.cheat code{font-size:12px;background:var(--surface);padding:0 4px;border-radius:4px}
.drop-hint{outline:2px dashed var(--accent);outline-offset:3px}

/* tables */
.tbl-wrap{overflow:auto}
.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.tbl th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:700;color:var(--ink2);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2;font-size:13px}
.tbl th button{border:0;background:none;padding:0;font:inherit;color:inherit}
.tbl td{padding:5px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr.is-sel td{background:var(--hl-soft)}
.tbl tr.excluded td{opacity:.45}
.tbl select.inp{padding:3px 22px 3px 6px;font-size:13px;max-width:170px}
.tbl .t-title{min-width:240px}
.tbl .t-title button{border:0;background:none;padding:0;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.tbl .t-title button:hover{text-decoration:underline}
.badge{display:inline-block;font-size:11.5px;padding:0 6px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-weight:700;margin-left:4px;vertical-align:1px}
.badge.warn{background:var(--hl-soft)}
.list-view{padding:12px 14px 120px}
.list-view .tbl-wrap{background:var(--surface);border-radius:12px;box-shadow:var(--shadow)}

/* outline */
.outline{max-width:900px;margin:0 auto;padding:18px 18px 120px}
.outline-actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.ol-sec{margin:0 0 18px}
.ol-h{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
.ol-h .sw{width:12px;height:12px;border-radius:4px;background:var(--c,var(--muted))}
.ol-h.l1{font-size:22px;border-bottom:2px solid var(--c,var(--line));padding-bottom:4px}
.ol-h.l2{font-size:18px}
.ol-h.l3,.ol-h.l4,.ol-h.l5{font-size:15.5px}
.ol-notes{white-space:pre-wrap;color:var(--ink2);font-size:14px;margin:0 0 8px}
.ol-list{list-style:none;padding:0;margin:0 0 6px}
.ol-item{list-style:none}
.ol-row{display:grid;grid-template-columns:auto auto 1fr;gap:6px 8px;align-items:start;padding:5px 6px 5px 2px;border-bottom:1px dashed var(--line2);border-radius:6px;background:var(--cbg,transparent);position:relative}
.ol-row[data-bg]{border-bottom-color:transparent;margin-bottom:2px}
.ol-grip{cursor:grab;color:var(--muted);opacity:.35;font-size:14px;line-height:22px;padding:0 2px;user-select:none}
.ol-row:hover .ol-grip{opacity:1}
.ol-row input[type=checkbox]{margin-top:3px}
.ol-body{min-width:0}
.ol-children{padding-left:26px;margin:2px 0 4px;border-left:2px solid var(--line2);margin-left:13px}
.ol-item.is-sel>.ol-row{box-shadow:inset 0 0 0 2px var(--hl)}
.ol-item.is-dragging>.ol-row,.ol-sub.is-dragging{opacity:.35}
.ol-sub{cursor:grab}
.ol-more{border:0;background:none;padding:2px 0;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer}
.drop-before{box-shadow:0 -3px 0 0 var(--accent)}
.drop-after{box-shadow:0 3px 0 0 var(--accent)}
.ol-h.is-over{background:var(--accent-soft);border-radius:6px;outline:2px dashed var(--accent);outline-offset:2px}
.ol-item .t{border:0;background:none;padding:0;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.ol-item .t:hover{text-decoration:underline}
.ol-item .m{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.ol-item .n{white-space:pre-wrap;color:var(--ink2);font-size:13.5px;margin-top:4px}
.ol-subs{list-style:none;padding:0 0 0 4px;margin:4px 0 0;font-size:14px;color:var(--ink2)}
.ol-indent{padding-left:18px;border-left:2px solid var(--line2);margin-left:5px}

/* reports */
.reports{padding:16px 16px 120px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start;max-width:1500px}
.rp{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px}
.rp h3{margin:0 0 10px;font:700 16px/1.2 var(--font-display)}
.rp.span2{grid-column:span 2}
@media (max-width:760px){.rp.span2{grid-column:auto}}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;grid-column:1 / -1}
.stat{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px}
.stat .v{font:700 28px/1.1 var(--font-display);letter-spacing:-.02em}
.stat .l{font-size:13px;color:var(--muted)}
.stat.alert .v{color:var(--danger)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:13.5px}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:12px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--c,var(--accent));border-radius:3px 0 0 3px}
.bar .val{font-variant-numeric:tabular-nums;color:var(--ink2);min-width:64px;text-align:right}
.rlist{list-style:none;margin:0;padding:0;font-size:14px}
.rlist li{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line2)}
.rlist li .t{flex:1 1 220px;min-width:0;border:0;background:none;padding:0;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.rlist li .t:hover{text-decoration:underline}
.rlist .d{color:var(--muted);font-size:12.5px;margin-left:auto;text-align:right}
.rp-date{font:700 13px var(--font-display);color:var(--ink2);margin:10px 0 2px}

/* settings */
.settings{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;padding:16px;max-width:1150px;margin:0 auto 120px}
.set-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px;align-self:start}
.set-nav button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:8px;color:var(--ink2)}
.set-nav button:hover{background:var(--chip)}
.set-nav button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.set-pane{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px 20px}
.set-pane h2{margin:0 0 4px;font:700 22px/1.2 var(--font-display);letter-spacing:-.01em}
.set-pane>p{margin:0 0 14px;color:var(--ink2)}
.rows{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:5px 6px;border-radius:8px}
.srow:hover{background:var(--panel)}
.srow .inp{padding:5px 8px}
.srow .grow{flex:1;min-width:140px}
.srow .kw{flex:1.3;min-width:160px}
.srow .cnt{font-size:12.5px;color:var(--muted);min-width:56px;text-align:right}
.srow .emoji{width:46px;text-align:center}
.tree-pad{display:inline-block;flex:none}
.lvl-tag{font-size:11.5px;color:var(--muted);min-width:70px}
.area-notes{width:100%;margin:2px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:4px 6px 4px 11px;font-size:14px}
.chip button{border:0;background:none;color:var(--muted);padding:0 4px;border-radius:50%}
.chip button:hover{color:var(--danger)}
.set-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.help-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;align-items:baseline}
.help-grid code{background:var(--chip);padding:1px 6px;border-radius:5px;white-space:nowrap}
.help h4{font:700 15px var(--font-display);margin:16px 0 8px}
.help h4:first-child{margin-top:0}

/* triage */
.triage{display:flex;flex-direction:column;gap:14px}
.tri-progress{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.tri-progress div{height:100%;background:var(--accent)}
.tri-card{position:relative;background:var(--panel);border-radius:12px;padding:18px 18px 16px 30px}
.tri-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;border-radius:12px 0 0 12px;background:var(--tag,var(--line))}
.tri-title{font:700 22px/1.25 var(--font-display);width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 6px;margin:-4px -6px;resize:none}
.tri-title:hover{border-color:var(--line)}
.tri-notes{white-space:pre-wrap;color:var(--ink2);margin-top:8px;font-size:14px;max-height:120px;overflow:auto}
.tri-row{display:flex;flex-direction:column;gap:6px}
.tri-row .lbl{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tri-opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:14px}
.opt:hover{border-color:var(--ink2)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.opt .k{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.opt .sw{width:10px;height:10px;border-radius:3px;background:var(--c,var(--muted))}
.opt.big{padding:10px 14px;font-size:15px}
.tri-done{text-align:center;padding:30px 10px}
.tri-done h3{font:700 26px var(--font-display);margin:0 0 6px}

/* export */
.fmt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.fmt{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;background:var(--surface)}
.fmt:hover{border-color:var(--ink2)}
.fmt input{position:absolute;opacity:0;pointer-events:none}
.fmt b{font-family:var(--font-display);font-size:15px}
.fmt span{font-size:12.5px;color:var(--muted)}
.fmt.on{border-color:var(--accent);background:var(--accent-soft)}
.exp-row{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 8px;align-items:flex-end}
.exp-pre{background:var(--chip);border-radius:8px;padding:10px 12px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;overflow:auto;max-height:34vh;margin:0}
.note-line{font-size:13px;color:var(--ink2);margin:8px 0 0}

/* toasts */
.toasts{position:fixed;left:16px;bottom:16px;z-index:55;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:var(--surface);padding:9px 10px 9px 14px;border-radius:10px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;font-size:14px;max-width:420px}
.toast button{border:0;background:rgba(127,127,127,.25);color:inherit;border-radius:6px;padding:3px 9px;font-weight:700}

/* responsive */
@media (max-width:900px){
  .imp{grid-template-columns:1fr}
  .settings{grid-template-columns:1fr}
  .set-nav{flex-direction:row;flex-wrap:wrap;position:static}
  .top-actions .lbl{display:none}
}
@media (max-width:640px){
  :root{--colw:84vw}
  .tb-filters{display:none;width:100%}
  .toolbar.show-f .tb-filters{display:flex}
  .tb-ftoggle{display:inline-flex}
  .tb-sep,#btn-theme,.tb-group label>span{display:none}
  .top-actions .btn{padding:6px 9px}
  .brand{font-size:19px}
  .seg button{padding:5px 9px}
  .top{padding:8px 10px}
  .quick{order:5;flex-basis:100%}
  .toolbar{padding:8px 10px}
  .tb-search{width:100%}
  .grid2{grid-template-columns:1fr}
  .board{padding:0 10px 140px}
  .selbar{left:8px;right:8px;transform:none;max-width:none;flex-wrap:nowrap;overflow-x:auto;bottom:10px;-webkit-overflow-scrolling:touch}
  .selbar .n{white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* print (outline / reports) */
@media print{
  body{overflow:visible;display:block;background:#fff;color:#000}
  .top,.toolbar,.selbar,.toasts,.outline-actions,.drawer,#modal-root{display:none!important}
  main#view{overflow:visible}
  .rp,.stat{box-shadow:none;border:1px solid #ccc}
}
.set-pane h3{font:700 16px/1.2 var(--font-display);margin:20px 0 6px}
.set-pane code,.note-line code{background:var(--chip);padding:0 5px;border-radius:4px;font-size:13px}
.cheat summary{cursor:pointer;font-weight:700;color:var(--ink)}
body.has-sel .col-key{display:inline-block}
.col-key[hidden]{display:none}

/* ---------- previews, subtasks, colors (v1.1) ---------- */
.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
.density-compact .card .card-title.clamp{-webkit-line-clamp:2;line-clamp:2}
.is-open>.card-title.clamp,.is-open>.ol-row .clamp,.ol-item.is-open>.ol-row .clamp{display:block;-webkit-line-clamp:unset;line-clamp:none;overflow:visible}
.ol-item .t.clamp{text-align:left}
.ol-item .n.clamp{margin-top:4px}
.card-more{display:flex;align-items:center;gap:6px;margin:7px 0 -2px;border:0;background:none;padding:2px 0;color:var(--ink2);font-size:12.5px;font-weight:700;text-align:left;cursor:pointer;max-width:100%}
.card-more:hover{color:var(--accent)}
.card-more .chev{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;background:var(--chip);font-size:10px;color:var(--ink2);flex:none}
.card[data-bg] .card-more .chev,.card[data-bg] .pill{background:rgba(255,255,255,.6)}
:root[data-theme="dark"] .card[data-bg] .pill,:root[data-theme="dark"] .card[data-bg] .card-more .chev{background:rgba(0,0,0,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card[data-bg] .pill,:root:not([data-theme="light"]) .card[data-bg] .card-more .chev{background:rgba(0,0,0,.28)}}
.density-compact .card:not(.is-open) .card-more{display:none}
.card-body{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px;cursor:default}
.cb-notes{white-space:pre-wrap;font-size:13.5px;color:var(--ink2);overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.cb-subs{display:flex;flex-direction:column;gap:3px}
.cb-sub{display:flex;gap:7px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.cb-sub input{margin-top:2px;flex:none}
.cb-sub.done span{text-decoration:line-through;color:var(--muted)}
.subtree{display:flex;flex-direction:column;gap:5px}
.subcard{position:relative;display:grid;grid-template-columns:auto 1fr;gap:7px;align-items:start;margin-left:calc(var(--d,0) * 16px);background:var(--scbg,var(--panel));border-radius:7px;padding:6px 8px;cursor:grab;border:1px solid transparent}
.card[data-bg] .subcard:not([data-bg]){--scbg:rgba(255,255,255,.6)}
:root[data-theme="dark"] .card[data-bg] .subcard:not([data-bg]){--scbg:rgba(0,0,0,.24)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card[data-bg] .subcard:not([data-bg]){--scbg:rgba(0,0,0,.24)}}
.subcard:hover{border-color:var(--line)}
.subcard.is-sel{border-color:var(--hl)}
.subcard.is-dragging{opacity:.35}
.subcard.is-done .sc-title{text-decoration:line-through;color:var(--muted)}
.sc-done{margin-top:2px}
.sc-title{font-size:13.5px;line-height:1.35;overflow-wrap:anywhere}
.subcard .card-meta{margin-top:4px}
.subtree .drop-ph{margin:0}
.add-sub{align-self:flex-start;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:3px 9px;font-size:13px}
.add-sub:hover{color:var(--ink);border-color:var(--muted)}
.add-sub-inp{width:100%;font-size:13.5px}
.nest-target{outline:2px solid var(--accent)!important;outline-offset:1px;position:relative}
.nest-target::after,.card.nest-target::after{content:attr(data-nest-label);position:absolute;left:auto;top:auto;width:auto;height:auto;box-shadow:none;line-height:1.4;right:6px;top:-11px;bottom:auto;z-index:3;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;pointer-events:none}
.card.nest-target{background:var(--accent-soft)}
.linkish{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.drawer-head .path .sep{color:var(--muted)}
.swatches,.sw-row{display:flex;flex-wrap:wrap;gap:6px}
.sw-row{padding:4px 8px 6px}
.swb{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--sw,var(--surface));padding:0;cursor:pointer;position:relative}
.swb[data-swv=""],.swb[data-color=""]{background:linear-gradient(135deg,transparent 44%,var(--muted) 44% 56%,transparent 56%),var(--surface)}
.swb:hover{transform:scale(1.08)}
.swb.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.menu .sw-row .swb{display:inline-block;width:24px;height:24px;padding:0;border-radius:50%;border:1.5px solid var(--line);background:var(--sw,var(--surface))}
.menu .sw-row .swb[data-swv=""]{background:linear-gradient(135deg,transparent 44%,var(--muted) 44% 56%,transparent 56%),var(--surface)}
.menu .sw-row .swb:hover{transform:scale(1.1);border-color:var(--ink2)}
.menu .sw-row .swb.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.st-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto auto;gap:4px;align-items:center;padding:3px 4px;border-radius:7px;background:var(--cbg,transparent)}
.st-row:hover{background:var(--cbg,var(--panel))}
.st-title{border:0;background:none;padding:2px 0;text-align:left;font:inherit;color:var(--ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-title:hover{text-decoration:underline}
.st-row.done .st-title{text-decoration:line-through;color:var(--muted)}
.st-meta{font-size:12.5px;color:var(--muted);white-space:nowrap}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--sw);border:1px solid var(--line);margin-right:6px;vertical-align:0}
.clamp-inline{display:-webkit-inline-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;max-width:100%}
/* in-app guide */
.guide-frame{width:100%;height:min(78vh,900px);border:0;border-radius:10px;background:var(--bg);display:block}
.modal.guide-modal{width:min(1240px,100%)}
.modal.guide-modal .modal-body{padding:0 12px 12px}
.help-link{font-size:13px;font-weight:700;color:var(--accent);border:0;background:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.pane-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;justify-content:space-between}
.modal-head .help-link{margin-right:4px}

.parent-line{font-size:13.5px;color:var(--muted);margin-bottom:-8px;overflow-wrap:anywhere}

</style>

<body>
<header class="top">
  <a class="brand" href="#" id="brand" aria-label="HatRack home">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
      <rect x="2" y="4" width="28" height="3" rx="1.5" fill="var(--muted)"/>
      <path d="M16 7v4" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 22c0-6 3.6-9.5 8-9.5s8 3.5 8 9.5z" fill="var(--accent)"/>
      <ellipse cx="16" cy="23" rx="12.5" ry="3.4" fill="var(--accent)"/>
      <path d="M8.4 19.4h15.2" stroke="var(--hl)" stroke-width="2.2"/>
    </svg>HatRack</a>
  <div class="seg" role="group" aria-label="View" id="views">
    <button data-view="board">Board</button><button data-view="list">List</button><button data-view="outline">Outline</button><button data-view="reports">Reports</button>
  </div>
  <form class="quick" id="quick-form" autocomplete="off">
    <input class="inp" id="quick" placeholder="Quick add — Call the accountant @Ledgerline !high ^fri ~15m" aria-label="Quick add a task (shortcuts work)">
  </form>
  <div class="top-actions">
    <button class="btn" id="btn-import" title="Paste or open a long list (I)">Import</button>
    <button class="btn" id="btn-triage">Triage</button>
    <button class="btn" id="btn-export" title="Export to Todoist, Asana, CSV, Markdown, calendar… (E)">Export</button>
    <button class="btn ghost" id="btn-settings" title="Groups, types, priorities, fields and backups">Configure</button>
    <button class="icon-btn" id="btn-help" aria-label="Help, visual guide and shortcuts" aria-haspopup="menu" title="Help, visual guide and shortcuts">?</button>
    <button class="icon-btn" id="btn-theme" aria-label="Switch theme"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/></svg></button>
  </div>
</header>
<div class="toolbar" id="toolbar"></div>
<main id="view" tabindex="-1"></main>
<div id="selbar" class="selbar" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Task details"></aside>
<div id="modal-root"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
'use strict';
/* ============ HatRack — core: utilities, data model, persistence ============ */

const LS_KEY = 'hatrack.data.v1';
const LS_UI = 'hatrack.ui.v1';
const APP_VERSION = '1.0.0';

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = '') => p + Date.now().toString(36).slice(-6) + Math.random().toString(36).slice(2, 8);
const norm = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '');

/** create a subtask from a line of text (shortcuts work, the group always follows the parent) */

/* ---------- card menu (right-click) ---------- */
function pointAnchor(x, y) { return { getBoundingClientRect: () => ({ left: x, right: x, top: y, bottom: y, width: 0, height: 0 }) }; }
function onContextMenu(e) {

function taskMenu(anchor, id) {

  const many = ids.length > 1, label = many ? `${ids.length} tasks` : `“${t.title.length > 34 ? t.title.slice(0, 32) + '…' : t.title}”`;

  if (!many && parentOf(t) && !childrenOf(id).length) items.push({ label: 'Turn into a subnote of its parent', onPick: () => toSubnote(t) });
  items.push({ label: 'Move to…', onPick: () => popMenu(anchor, areaMenuItems(aid => moveToArea(ids, aid)), { filter: true }) });
  items.push({ sep: true });
  items.push({ label: 'Duplicate', onPick: () => { sel = new Set(ids); duplicateSel(); } });
  items.push({ label: 'Copy as text', onPick: async () => { await copyText(tasksAsText(ids.map(i => TASK[i]))); toast('Copied as text'); } });
  items.push({ label: 'Delete', onPick: () => deleteTasks(ids.map(i => TASK[i])) });

}
function pickParent(anchor, ids) {

  const pool = scopeTasks().filter(p => !blocked.has(p.id) && !isDone(p) && moving.every(m => canNest(m, p)));
  const pos = areaPositions();
  pool.sort((a, b) => (pos[rootOf(a).areaId] || 0) - (pos[rootOf(b).areaId] || 0) || rootOf(a).order - rootOf(b).order || taskDepth(a) - taskDepth(b) || a.order - b.order);
  if (!pool.length) { toast('No task here can take these as subtasks.'); return; }
  popMenu(anchor, pool.slice(0, 400).map(p => ({ label: p.title, indent: taskDepth(p), color: areaColor(p.areaId) || '', hint: taskDepth(p) ? '' : (A[p.areaId]?.name || 'Unsorted'), onPick: () => nestTasks(ids, p.id, false) })), { filter: true });
}
function colorTasks(ids, c) {

}

}
function nestTasks(ids, parentId, copy) {

  const kid = b.closest('[data-cid]');
  if (kid) {
    const c = TASK[kid.dataset.cid]; if (!c) return;
    if (b.dataset.st === 'open') return openEditor(c.id);
    if (b.dataset.st === 'out') { unnestTasks([c.id]); return renderDrawer(); }
    if (b.dataset.st === 'tosub') { toSubnote(c); return renderDrawer(); }
    if (b.dataset.st === 'del') { deleteTasks([c]); return renderDrawer(); }
    return;
  }
  if (b.dataset.color !== undefined) return edit(t => { t.color = b.dataset.color; }, { drawer: true });
  const att = b.closest('[data-aid]');
  if (att) {
    const a = t.attachments.find(x => x.id === att.dataset.aid); if (!a) return;
    if (b.dataset.att === 'del') edit(t => { t.attachments = t.attachments.filter(x => x.id !== a.id); }, { drawer: true });
    if (b.dataset.att === 'open') openFileAttachment(a);

  }

    case 'dup': { let c; mutate('Duplicate task', () => { const cs = dupDeep(t); D.tasks.push(...cs); c = cs[0]; }); openEditor(c.id); toast('Duplicated — you are now editing the copy', { undo: true }); return; }
    case 'openparent': { const p = parentOf(t); if (p) openEditor(p.id); return; }
    case 'copy': { await copyText(tasksAsText([t])); toast('Copied as text'); return; }
    case 'delete': { closeDrawer(true); deleteTasks([t]); return; }
    case 'resetseen': return edit(t => { t.seen = 1; }, { drawer: true });
    case 'addlink': {
      const r = await askFields('Add a link', [{ key: 'url', label: 'URL', placeholder: 'https://…', type: 'url' }, { key: 'name', label: 'Label (optional)', placeholder: 'e.g. Contract draft' }]);
      if (r && r.url.trim()) edit(t => { t.attachments.push({ id: uid('at'), kind: 'link', url: r.url.trim(), name: r.name.trim() }); }, { drawer: true });
      return;
    }
  }
}
function onDrawerKey(e) {

}
async function addFiles(files) {
  const added = [];
  for (const f of files) {
    if (f.size > 50 * 1048576) { toast(`“${f.name}” is over 50 MB — add it as a link instead.`); continue; }
    const fileId = uid('f');
    try { await FileStore.put(fileId, { name: f.name, type: f.type, size: f.size, blob: f }); added.push({ id: uid('at'), kind: 'file', name: f.name, type: f.type, size: f.size, fileId }); }
    catch (err) { toast('This browser blocked file storage (private mode?). Add a link instead.'); break; }
  }

}
async function openFileAttachment(a) {
  const viewable = /^(image\/|application\/pdf|text\/|video\/|audio\/)/.test(a.type || '');
  const w = viewable ? window.open('', '_blank') : null;
  try {
    const rec = await FileStore.get(a.fileId);
    if (!rec || !rec.blob) { if (w) w.close(); toast('That file is not stored in this browser (it may have been added on another device).'); return; }
    const url = URL.createObjectURL(rec.blob);
    if (w) w.location.href = url;
    else { const l = document.createElement('a'); l.href = url; l.download = a.name || 'attachment'; document.body.appendChild(l); l.click(); l.remove(); }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (err) { if (w) w.close(); toast('Could not open the file from browser storage.'); }
}

/* ---------- modals ---------- */
function openModal({ title, body, foot = '', wide = false, onClose, cls = '', autofocus = true, help = '' }) {
  const back = document.createElement('div'); back.className = 'modal-back';
  back.innerHTML = `<div class="modal${wide ? ' wide' : ''} ${cls}" tabindex="-1" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><h3>${esc(title)}</h3>${help ? `<button class="help-link" data-guide="${esc(help)}">How this works</button>` : ''}<button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="modal-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div>`;
  $('#modal-root').appendChild(back);
  let downOnBack = false;
  back.addEventListener('mousedown', e => { downOnBack = e.target === back; });
  back.addEventListener('click', e => { if ((e.target === back && downOnBack) || e.target.closest('[data-close]')) close(); downOnBack = false; });
  function close() { if (!back.isConnected) return; back.remove(); onClose && onClose(); }
  back.close = close;
  if (!autofocus) setTimeout(() => back.querySelector('.modal').focus(), 20);
  else setTimeout(() => { const f = back.querySelector('[autofocus], .modal-body input:not([type=checkbox]):not([type=file]), .modal-body textarea'); (f || back.querySelector('.modal-head .icon-btn'))?.focus(); }, 20);
  return back;
}
function askFields(title, fields, okLabel = 'Save') {
  return new Promise(res => {
    let done = false;
    const m = openModal({
      title, body: `<form class="ask" style="display:flex;flex-direction:column;gap:10px">${fields.map((f, i) => `<label class="field"><span>${esc(f.label)}</span><input class="inp" name="${esc(f.key)}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}" placeholder="${esc(f.placeholder || '')}" ${i === 0 ? 'autofocus' : ''}></label>`).join('')}<button type="submit" hidden></button></form>`,
      foot: `<button class="btn" data-close>Cancel</button><button class="btn primary" data-ok>${esc(okLabel)}</button>`,
      onClose: () => { if (!done) res(null); },
    });
    const finish = () => { done = true; const out = {}; fields.forEach(f => out[f.key] = m.querySelector(`[name="${CSS.escape(f.key)}"]`).value); m.close(); res(out); };
    m.querySelector('form').addEventListener('submit', e => { e.preventDefault(); finish(); });
    m.querySelector('[data-ok]').addEventListener('click', finish);
  });
}
function confirmBox(title, message, okLabel = 'OK', danger = false) {
  return new Promise(res => {
    let done = false;
    const m = openModal({ title, body: `<p style="margin:0">${message}</p>`, foot: `<button class="btn" data-close>Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok autofocus>${esc(okLabel)}</button>`, onClose: () => { if (!done) res(false); } });
    m.querySelector('[data-ok]').addEventListener('click', () => { done = true; m.close(); res(true); });

}

/* ---------- popover menus ---------- */
let openMenuEl = null;
function closeMenu() { if (openMenuEl) { openMenuEl.remove(); openMenuEl = null; document.removeEventListener('mousedown', menuOutside, true); return true; } return false; }
function menuOutside(e) { if (openMenuEl && !openMenuEl.contains(e.target)) closeMenu(); }
function popMenu(anchor, items, { filter = false } = {}) {

    m.querySelector('.mi').innerHTML = items.map((it, i) => [it, i]).filter(([it]) => !q || (it.label && it.label.toLowerCase().includes(q))).map(([it, i]) =>
      it.sep ? (q ? '' : '<hr>') : it.hd ? (q ? '' : `<div class="hd">${esc(it.hd)}</div>`) : it.swatches ? `<div class="sw-row">${CARD_COLORS.map(([k, l]) => `<button class="swb${it.value != null && (it.value || '') === k ? ' on' : ''}" data-i="${i}" data-swv="${k}" title="${l}" aria-label="${l}" style="--sw:${k ? tintVar(k) : 'var(--surface)'}"></button>`).join('')}</div>`
        : `<button role="menuitem" data-i="${i}" style="padding-left:${10 + (q ? 0 : (it.indent || 0) * 14)}px">${it.color !== undefined ? `<span class="sw" style="--c:${it.color || 'transparent'};${it.color ? '' : 'border:1px dashed var(--line)'}"></span>` : ''}<span>${esc(it.label)}</span>${it.hint ? `<span class="muted sm" style="margin-left:auto">${esc(it.hint)}</span>` : ''}</button>`).join('');
  };
  draw('');
  document.body.appendChild(m); openMenuEl = m;
  const r = anchor.getBoundingClientRect(); const mw = m.offsetWidth, mh = m.offsetHeight;
  let x = Math.min(r.left, innerWidth - mw - 8), y = r.bottom + 4;
  if (y + mh > innerHeight - 8) y = Math.max(8, r.top - mh - 4);
  m.style.left = Math.max(8, x) + 'px'; m.style.top = y + 'px';
  m.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (!b) return; const it = items[+b.dataset.i]; closeMenu(); it.onPick && (it.swatches ? it.onPick(b.dataset.swv) : it.onPick()); });
  m.addEventListener('keydown', e => {
    const bs = $$('button[data-i]', m); const i = bs.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); (bs[i + 1] || bs[0])?.focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); (bs[i - 1] || bs[bs.length - 1])?.focus(); }
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); bs[0]?.click(); }
  });
  const fi = m.querySelector('input'); if (fi) { fi.addEventListener('input', () => draw(fi.value)); fi.focus(); } else m.querySelector('button')?.focus();
  setTimeout(() => document.addEventListener('mousedown', menuOutside, true), 0);
}

/* ---------- toasts ---------- */
function toast(msg, { undo: withUndo = false, ms = 5200 } = {}) {
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = `<span>${esc(msg)}</span>${withUndo ? '<button type="button">Undo</button>' : ''}`;
  if (withUndo) el.querySelector('button').addEventListener('click', () => { undo(); el.remove(); });
  box.appendChild(el);
  while (box.children.length > 2) box.firstElementChild.remove();
  setTimeout(() => el.remove(), withUndo ? ms + 2500 : ms);
}

  txt: 'Each line becomes one task. Paste into a Trello list, Apple Reminders, Things, TickTick or Microsoft To Do.',

function openExport(preset = {}) {
  const st = { fmt: U.exportFmt || 'csv', scope: preset.ids ? 'ids' : preset.scope === 'selected' && sel.size ? 'selected' : (sel.size ? 'selected' : 'view'), done: false, sections: U.exportSections || 'l1', split: false, board: true, typeLabel: true, bom: true, tokens: false };
  const scopes = () => {
    const all = D.tasks.length, view = visibleTasks().length;
    const o = [['view', `On screen now — ${cur() ? pathStr(cur()) : 'whole rack'}${filtersActive() ? ', filtered' : ''} (${view})`], ['all', `Everything (${all})`]];
    if (sel.size) o.unshift(['selected', `Selected (${sel.size})`]);
    if (preset.ids) o.unshift(['ids', `${preset.label} (${preset.ids.length})`]);
    return o;
  };
  const m = openModal({
    title: 'Export', wide: true, help: 'export',
    body: `<div class="fmt-grid" id="ex-fmts">${EXPORT_FORMATS.map(f => `<label class="fmt${f.id === st.fmt ? ' on' : ''}"><input type="radio" name="ex-fmt" value="${f.id}" ${f.id === st.fmt ? 'checked' : ''}><b>${esc(f.name)}</b><span>${esc(f.desc)}</span></label>`).join('')}</div>
      <div class="exp-row">
        <label class="field"><span>Which tasks</span><select class="inp" id="ex-scope">${scopes().map(s => opt(s[0], s[1], st.scope)).join('')}</select></label>
        <label class="field"><span>Sections</span><select class="inp" id="ex-sec">${sectionOptions().map(s => opt(s[0], s[1], st.sections)).join('')}</select></label>
        <label class="chk"><input type="checkbox" id="ex-done"> Include done tasks</label>
        <span id="ex-opts" style="display:flex;gap:12px;flex-wrap:wrap"></span>
      </div>
      <p class="note-line" id="ex-help"></p>
      <div id="ex-notes"></div>
      <p class="muted sm" id="ex-file" style="margin:10px 0 4px"></p>
      <pre class="exp-pre" id="ex-pre"></pre>`,
    foot: `<span class="left muted sm" id="ex-count"></span><button class="btn" id="ex-copy">Copy</button><button class="btn primary" id="ex-dl">Download</button>`,
  });
  const q = s => m.querySelector(s);
  let built = null;
  function list() {
    let l = st.scope === 'all' ? D.tasks.slice() : st.scope === 'selected' ? selTasks() : st.scope === 'ids' ? preset.ids.map(i => TASK[i]).filter(Boolean) : visibleTasks();
    if (!st.done) l = l.filter(t => !isDone(t));

  }
  function optsHTML() {
    const c = (id, label, on, title = '') => `<label class="chk" title="${esc(title)}"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}> ${label}</label>`;
    const f = st.fmt; let h = '';
    if (['csv', 'todoist', 'asana', 'md', 'txt'].includes(f)) h += c('ex-split', 'One file per section', st.split, 'Makes a separate file for each section — handy for one project per business.');
    if (f === 'todoist') h += c('ex-board', 'Open as a board', st.board) + c('ex-tl', 'Add the type as a label', st.typeLabel);
    if (f === 'csv') h += c('ex-bom', 'Excel-friendly encoding', st.bom, 'Adds a marker so Excel shows emoji and accents correctly.');
    if (f === 'txt') h += c('ex-tok', 'Keep HatRack shortcuts', st.tokens, 'Adds @group #type !priority ^due so the list can be re-imported.');
    q('#ex-opts').innerHTML = h;
  }
  function update() {
    const l = list();
    built = buildExport(st.fmt, l, { sections: st.sections, split: st.split, board: st.board, typeLabel: st.typeLabel, bom: st.bom, tokens: st.tokens, title: cur() ? `${pathStr(cur())} — tasks` : 'HatRack tasks' });
    q('#ex-help').textContent = EXPORT_HELP[st.fmt];
    q('#ex-notes').innerHTML = built.notes.map(n => `<p class="note-line" style="color:var(--danger)">${esc(n)}</p>`).join('');
    const f0 = built.files[0];
    q('#ex-file').textContent = built.files.length > 1 ? `${built.files.length} files — previewing ${f0.name}` : f0 ? f0.name : '';
    const lines = (f0?.text || '').replace(/^﻿/, '').split(/\r?\n/);
    q('#ex-pre').textContent = lines.slice(0, 60).join('\n') + (lines.length > 60 ? `\n… ${lines.length - 60} more lines` : '');

    const el = e.target;
    if (el.name === 'ex-fmt') { st.fmt = el.value; U.exportFmt = st.fmt; saveUI(); $$('.fmt', m).forEach(x => x.classList.toggle('on', x.querySelector('input').checked)); optsHTML(); }
    if (el.id === 'ex-scope') st.scope = el.value;

    if (el.id === 'ex-bom') st.bom = el.checked;
    if (el.id === 'ex-tok') st.tokens = el.checked;
    update();
  });
  q('#ex-dl').addEventListener('click', () => {
    built.files.forEach((f, i) => setTimeout(() => downloadText(f.name, f.text, f.mime), i * 350));
    toast(built.files.length > 1 ? `Downloading ${built.files.length} files` : `Downloaded ${built.files[0].name}`);
  });
  q('#ex-copy').addEventListener('click', async () => {
    const text = built.files.map(f => f.text.replace(/^﻿/, '')).join(st.fmt === 'md' || st.fmt === 'txt' ? '\n\n' : '');
    await copyText(built.files.length > 1 && !['md', 'txt'].includes(st.fmt) ? built.files[0].text.replace(/^﻿/, '') : text);
    toast('Copied to the clipboard');
  });
  optsHTML(); update();
}

/* ---------- triage ---------- */
let triageOn = false;
function openTriage() {
  const root = cur();
  const queue = sortTasks(D.tasks.filter(t => !isDone(t) && isRootTask(t) && (root ? t.areaId === root : !(t.areaId && A[t.areaId]))), 'manual').map(t => t.id);
  if (!queue.length) { toast(root ? `Everything in ${A[root].name} is already sorted further.` : 'Nothing is unsorted right now.'); return; }
  if (!D.areas.length) { toast('Add your groups first — Configure → Groups & levels, or “+ Add” on the board.'); }
  snapshot('Triage session');
  let i = 0, level = root; const sortedIds = new Set();
  triageOn = true;
  const m = openModal({
    title: root ? `Triage — ${A[root].name}` : 'Triage unsorted tasks', body: '<div class="triage" id="tri"></div>', cls: 'tri-modal', autofocus: false, help: 'triage',
    onClose: () => {
      triageOn = false; document.removeEventListener('keydown', onKey, true); reindex(); save(); renderAll();
      if (sortedIds.size) toast(`Triage: sorted ${plural(sortedIds.size, 'task')}`, { undo: true });
    },
  });
  const box = m.querySelector('#tri');
  const task = () => TASK[queue[i]];
  const touch = t => { t.updated = now(); save(); };
  function render() {
    while (i < queue.length && !TASK[queue[i]]) i++;
    if (i >= queue.length) {
      box.innerHTML = `<div class="tri-done"><h3>All hung up</h3><p class="muted">You sorted ${plural(sortedIds.size, 'task')}${queue.length - sortedIds.size > 0 ? ` and left ${queue.length - sortedIds.size} where ${queue.length - sortedIds.size === 1 ? 'it was' : 'they were'}` : ''}.</p><div class="set-actions" style="justify-content:center"><button class="btn primary" data-close>Back to the board</button></div></div>`;
      return;
    }
    const t = task(); const options = kids(level); const lvlName = levelName(depthOf(level) + 1);
    const chips = (items, attr, curv) => items.map(x => `<button class="opt" data-${attr}="${x.id}" aria-pressed="${x.id === curv}" style="--c:${x.color || 'var(--muted)'}"><span class="sw"></span>${x.icon ? esc(x.icon) + ' ' : ''}${esc(x.name)}</button>`).join('');
    const upPath = ancestors(level).filter(a => !root || inSubtree(a.id, root));
    box.innerHTML = `
      <div class="tri-progress" aria-hidden="true"><div style="width:${(i / queue.length) * 100}%"></div></div>
      <div class="muted sm">${i + 1} of ${queue.length} · ${sortedIds.size} sorted so far</div>
      <div class="tri-card" style="--tag:${areaColor(t.areaId) || 'var(--line)'}">
        <textarea class="tri-title" id="tri-title" rows="1" aria-label="Title">${esc(t.title)}</textarea>
        ${t.notes ? `<div class="tri-notes">${esc(t.notes)}</div>` : ''}
        ${t.subnotes.length ? `<div class="tri-notes">${t.subnotes.map(s => `${s.done ? '☑' : '☐'} ${esc(s.text)}`).join('\n')}</div>` : ''}
        ${childrenOf(t.id).length ? `<div class="tri-notes">${taskDescendants(t).map(c => `${'  '.repeat(taskDepth(c) - 1)}↳ ${esc(c.title)}`).join('\n')}</div>` : ''}
        ${t.source || (t.seen || 1) > 1 ? `<div class="muted sm" style="margin-top:8px">${t.source ? 'From ' + esc(t.source) : ''}${(t.seen || 1) > 1 ? ` · noted ×${t.seen}` : ''}</div>` : ''}
      </div>
      <div class="tri-row"><div class="lbl">${upPath.length && level !== root ? `<button class="btn ghost sm" data-tri="up">‹ ${esc(upPath.map(a => a.name).join(' / '))}</button><kbd>⌫</kbd> · ` : ''}${options.length ? `Pick ${esc(aAn(lvlName.toLowerCase()))} — press its number${level !== root ? ', or Enter to keep it here' : ''}` : (level === root ? `No ${esc(lvlName.toLowerCase())} yet — add one` : 'No deeper groups here. Press Enter for the next task.')}</div>
        <div class="tri-opts">${options.map((a, j) => `<button class="opt big" data-area="${a.id}" style="--c:${areaColor(a.id) || 'var(--muted)'}" aria-pressed="${inSubtree(t.areaId, a.id)}"><span class="sw"></span>${esc(a.name)}${kids(a.id).length ? ' ›' : ''}${j < 9 ? `<span class="k">${j + 1}</span>` : ''}</button>`).join('')}<button class="opt" data-newarea>+ New ${esc(lvlName.toLowerCase())}</button></div></div>
      <div class="tri-row"><div class="lbl">Type <kbd>T</kbd></div><div class="tri-opts">${chips(D.types, 'ty', t.typeId)}</div></div>
      <div class="tri-row"><div class="lbl">Priority <kbd>P</kbd></div><div class="tri-opts">${chips(D.priorities, 'pr', t.priorityId)}</div></div>
      <div class="tri-row"><div class="lbl">Time</div><div class="tri-opts">${durPresets().map(d => `<button class="opt" data-dur="${d}" aria-pressed="${+t.duration === d}">${fmtDur(d)}</button>`).join('')}</div></div>
      <div class="tri-row"><div class="lbl">Due</div><div class="tri-opts">${[['today', 'Today'], ['tomorrow', 'Tomorrow'], ['week', 'This week'], ['next', 'Next week'], ['none', 'No date']].map(([k, l]) => { const v = k === 'tomorrow' ? addDays(todayStr(), 1) : dueForBucket(k); return `<button class="opt" data-due="${v || ''}" aria-pressed="${(t.due || '') === (v || '')}">${l}</button>`; }).join('')}<input class="inp" type="date" id="tri-date" value="${esc(t.due || '')}" aria-label="Pick a date"></div></div>
      <div class="set-actions" style="align-items:center">
        <button class="btn" data-tri="prev" ${i === 0 ? 'disabled' : ''}>← Back</button><button class="btn" data-tri="skip">Skip <kbd>S</kbd></button>
        <button class="btn" data-tri="done">Mark done <kbd>D</kbd></button><button class="btn danger" data-tri="delete">Delete</button>
        <span class="spacer"></span><label class="chk sm"><input type="checkbox" id="tri-auto" ${U.triageAuto ? 'checked' : ''}> Jump ahead after the last level</label>
        <button class="btn primary" data-tri="next">Next <kbd>Enter</kbd></button></div>`;
    autoGrow(box.querySelector('#tri-title'));
  }
  function next() { i++; level = root; render(); }
  function prev() { if (i > 0) { i--; level = root; render(); } }
  function up() { if (level === root) return; const p = A[level]?.parentId || null; level = root && !inSubtree(p, root) ? root : p; render(); }
  function pickArea(id) {
    const t = task(); setAreaDeep(t, id);
    touch(t); sortedIds.add(t.id);
    if (kids(id).length) { level = id; render(); } else if (U.triageAuto) next(); else { level = id; render(); }
  }
  function cycle(arr, key) { const t = task(); const ix = arr.findIndex(x => x.id === t[key]); t[key] = ix + 1 < arr.length ? arr[ix + 1].id : null; touch(t); render(); }
  function del() { const t = task(); const gone = new Set(withDescendants([t]).map(x => x.id)); D.tasks = D.tasks.filter(x => !gone.has(x.id)); reindex(); save(); render(); }
  function markDone() { const t = task(); const msg = setStatus(t, doneStatus()); touch(t); if (msg) toast(msg); next(); }
  box.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return; const t = task();
    if (b.dataset.area) return pickArea(b.dataset.area);
    if (b.hasAttribute('data-newarea')) { const id = await addAreaQuiet(level); if (id) pickArea(id); else render(); return; }
    if (b.dataset.ty) { t.typeId = t.typeId === b.dataset.ty ? null : b.dataset.ty; touch(t); return render(); }
    if (b.dataset.pr) { t.priorityId = t.priorityId === b.dataset.pr ? null : b.dataset.pr; touch(t); return render(); }
    if (b.dataset.dur) { t.duration = +t.duration === +b.dataset.dur ? null : +b.dataset.dur; touch(t); return render(); }
    if (b.dataset.due !== undefined) { t.due = b.dataset.due || null; touch(t); return render(); }
    const a = b.dataset.tri;
    if (a === 'next' || a === 'skip') next(); else if (a === 'prev') prev(); else if (a === 'up') up(); else if (a === 'done') markDone(); else if (a === 'delete') del();
  });
  box.addEventListener('input', e => { if (e.target.id === 'tri-title') { autoGrow(e.target); const t = task(); t.title = e.target.value.replace(/\n/g, ' ').trim() || 'Untitled'; touch(t); } });
  box.addEventListener('change', e => {
    if (e.target.id === 'tri-date') { const t = task(); t.due = e.target.value || null; touch(t); render(); }
    if (e.target.id === 'tri-auto') { U.triageAuto = e.target.checked; saveUI(); }
  });
  function onKey(e) {
    if (!m.isConnected || $('#modal-root').lastElementChild !== m) return;
    if (e.key === 'Escape' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (isTypingTarget(e.target)) { if (e.key === 'Enter' && e.target.id === 'tri-title') { e.preventDefault(); e.target.blur(); } return; }
    if (i >= queue.length) return;
    const k = e.key, kl = k.toLowerCase(); let hit = true;
    if (/^[1-9]$/.test(k)) { const a = kids(level)[+k - 1]; if (a) pickArea(a.id); else hit = false; }
    else if (k === 'Enter' || k === 'ArrowRight' || kl === 's') next();
    else if (k === 'ArrowLeft') prev();
    else if (k === 'Backspace') up();
    else if (kl === 'd') markDone();
    else if (kl === 't') cycle(D.types, 'typeId');
    else if (kl === 'p') cycle(D.priorities, 'priorityId');
    else if (k === 'Delete') del();
    else hit = false;
    if (hit) { e.preventDefault(); e.stopPropagation(); }
  }
  document.addEventListener('keydown', onKey, true);
  render();
}
/** add an area without a separate undo step (used inside triage) */
async function addAreaQuiet(parentId) {
  const lvl = levelName(depthOf(parentId) + 1);
  const r = await askFields(`New ${lvl.toLowerCase()}`, [{ key: 'name', label: 'Name', placeholder: parentId ? `Inside ${A[parentId].name}` : 'A business, organization, project or “Personal”' }]);
  if (!r || !r.name.trim()) return null;
  const a = { id: uid('ar'), name: r.name.trim(), parentId: parentId || null, color: parentId ? '' : nextColor(), keywords: '', notes: '', order: kids(parentId).length };
  D.areas.push(a); reindex(); save(); return a.id;
}

const GUIDE_URL = 'guide.html';
function openGuide(section = '') {

/* ============ HatRack — Configure (settings) ============ */

const SET_TABS = [['hierarchy', 'Groups & levels'], ['types', 'Task types'], ['priorities', 'Priorities'], ['statuses', 'Statuses'], ['durations', 'Durations'], ['fields', 'Custom fields'], ['data', 'Data & backup']];
let openAreaNotes = new Set(), cfgSnapEl = null;

function renderSettings() {
  const tab = U.settingsTab || 'hierarchy';
  $('#view').innerHTML = `<div class="settings"><nav class="set-nav" aria-label="Configure sections">${SET_TABS.map(([k, l]) => `<button data-tab="${k}" aria-current="${k === tab}">${l}</button>`).join('')}</nav>
    <section class="set-pane" id="set-pane">${paneHTML(tab)}</section></div>`;
}
function rerenderPane(focusSel) {
  const p = $('#set-pane'); if (!p) return;
  p.innerHTML = paneHTML(U.settingsTab);
  if (focusSel) { const el = $(focusSel); if (el) { el.focus(); el.select?.(); } }
}
function paneHTML(tab) {
  switch (tab) {
    case 'types': return paneTypes();

async function onSettingsClick(e) {
  if (U.view !== 'settings') return;

  if (b.dataset.tab) { U.settingsTab = b.dataset.tab; saveUI(); renderSettings(); return; }
  if (b.dataset.add) return addConfigItem(b.dataset.add);

  if (b.dataset.durop === 'add') { const m = parseDuration($('#dur-new').value); if (!m) { toast('Try something like 45m, 1h30m or 2d.'); return; } mutate('Add duration', () => { if (!D.durations.includes(m)) D.durations.push(m); }); return; }

async function addConfigItem(kind) {

async function deleteConfigItem(kind, item) {
  const field = { types: 'typeId', priorities: 'priorityId', statuses: 'statusId' }[kind];
  const n = field ? D.tasks.filter(t => t[field] === item.id).length : D.tasks.filter(t => t.custom && item.id in t.custom).length;
  if (kind === 'statuses') {
    if (!item.done && D.statuses.filter(s => !s.done).length <= 1) { toast('Keep at least one status that isn’t done.'); return; }
    if (D.statuses.length <= 1) { toast('Keep at least one status.'); return; }
  }
  const what = kind === 'fields' ? `Its values on ${plural(n, 'task')} will be removed.` : n ? `${plural(n, 'task')} ${n === 1 ? 'uses' : 'use'} it and will be cleared${kind === 'statuses' ? ' back to the first status' : ''}.` : 'No tasks use it.';
  if (!(await confirmBox(`Delete “${item.name}”?`, esc(what), 'Delete', true))) return;
  mutate(`Delete ${item.name}`, () => {
    D[kind] = D[kind].filter(x => x !== item); reindex();
    if (kind === 'statuses') { const alt = item.done ? D.statuses.find(s => s.done)?.id : null; D.tasks.forEach(t => { if (t.statusId === item.id) t.statusId = alt || defaultStatus(); }); }
    else if (field) D.tasks.forEach(t => { if (t[field] === item.id) t[field] = null; });
    if (kind === 'fields') { D.tasks.forEach(t => { if (t.custom) delete t.custom[item.id]; }); if (U.group === 'cf:' + item.id) U.group = 'area'; if (U.lanes === 'cf:' + item.id) U.lanes = 'none'; saveUI(); }
  });
}
async function areaOp(op, a) {

  const reorder = (list) => list.forEach((x, i) => { x.order = i; });
  if (op === 'notes') { openAreaNotes.add(a.id); rerenderPane(`[data-id="${a.id}"] [data-k="notes"]`); return; }
  if (op === 'up' && si > 0) return mutate('Reorder', () => { sibs.splice(si, 1); sibs.splice(si - 1, 0, a); reorder(sibs); });
  if (op === 'down' && si < sibs.length - 1) return mutate('Reorder', () => { sibs.splice(si, 1); sibs.splice(si + 1, 0, a); reorder(sibs); });
  if (op === 'in' && si > 0) { const p = sibs[si - 1]; return mutate('Move inside', () => { a.parentId = p.id; a.order = kids(p.id).length; if (a.color === areaColor(p.id)) a.color = ''; }); }

    return mutate('Move out', () => { a.parentId = p.parentId || null; if (!a.parentId && !a.color) a.color = areaColor(p.id) || nextColor(); const list = kids(p.parentId).filter(x => x !== a); list.splice(list.indexOf(p) + 1, 0, a); reorder(list); });
  }
  if (op === 'add') { const id = uid('ar'); const d = depthOf(a.id); mutate('Add group', () => { D.areas.push({ id, name: `New ${levelName(d + 1).toLowerCase()}`, parentId: a.id, color: '', keywords: '', notes: '', order: kids(a.id).length }); }); rerenderPane(`[data-id="${id}"] [data-k="name"]`); return; }
  if (op === 'del') {
    const sub = descendants(a.id).length; const n = D.tasks.filter(t => t.areaId === a.id).length;
    const dest = a.parentId ? `“${A[a.parentId].name}”` : 'Unsorted';
    if ((n || sub) && !(await confirmBox(`Delete “${a.name}”?`, `${n ? `Its ${plural(n, 'task')} move to ${esc(dest)}. ` : ''}${sub ? `Its ${plural(sub, 'sub-group')} move up a level.` : ''}`, 'Delete', true))) return;
    mutate(`Delete ${a.name}`, () => {
      D.tasks.forEach(t => { if (t.areaId === a.id) t.areaId = a.parentId || null; });

async function downloadBackup(withFiles) {
  const out = clone(D); out.exportedAt = new Date().toISOString();
  if (withFiles) {
    out.files = {};
    const ids = new Set(); D.tasks.forEach(t => t.attachments.forEach(x => x.fileId && ids.add(x.fileId)));
    for (const id of ids) {
      try { const rec = await FileStore.get(id); if (rec?.blob) out.files[id] = { name: rec.name, type: rec.type, size: rec.size, data: await blobToDataURL(rec.blob) }; } catch (e) { }
    }

}
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
/** a setup template: everything in Configure, no tasks — for handing a standard structure to a team */
function downloadTemplate() {

  downloadText(`hatrack-setup-${todayStr()}.json`, JSON.stringify(out, null, 2), 'application/json');

/** add groups, types, priorities, statuses and fields that aren't here yet (matched by ID or name); returns ID maps */
function mergeConfig(inc) {
  const maps = { areas: new Map(), types: new Map(), priorities: new Map(), statuses: new Map(), fields: new Map() };
  for (const k of ['types', 'priorities', 'statuses', 'fields']) {
    for (const x of inc[k] || []) {
      const hit = D[k].find(y => y.id === x.id) || D[k].find(y => norm(y.name) === norm(x.name));
      if (hit) {
        maps[k].set(x.id, hit.id);
        if (k === 'fields' && x.kind === 'select' && hit.kind === 'select') hit.options = [...new Set([...(hit.options || []), ...(x.options || [])])];
        if (k === 'types' && x.keywords) hit.keywords = [...new Set([...kwList(hit.keywords), ...kwList(x.keywords)])].join(', ');
      } else { D[k].push(x); maps[k].set(x.id, x.id); }
    }
  }
  const incA = inc.areas || []; const byId = Object.fromEntries(incA.map(a => [a.id, a]));
  const depth = a => { let d = 0, p = byId[a.parentId], g = 0; while (p && g++ < 64) { d++; p = byId[p.parentId]; } return d; };
  incA.slice().sort((a, b) => depth(a) - depth(b) || (a.order ?? 0) - (b.order ?? 0)).forEach(a => {
    const pid = a.parentId ? maps.areas.get(a.parentId) || null : null;
    const hit = D.areas.find(y => y.id === a.id) || D.areas.find(y => (y.parentId || null) === pid && norm(y.name) === norm(a.name));
    if (hit) {
      maps.areas.set(a.id, hit.id);
      if (a.keywords) hit.keywords = [...new Set([...kwList(hit.keywords), ...kwList(a.keywords)])].join(', ');
      if (!hit.notes && a.notes) hit.notes = a.notes;
    } else { const n = { ...a, parentId: pid, order: D.areas.filter(y => (y.parentId || null) === pid).length }; D.areas.push(n); maps.areas.set(a.id, n.id); }
  });
  if (Array.isArray(inc.levelNames) && JSON.stringify(D.levelNames) === JSON.stringify(defaultData().levelNames)) D.levelNames = inc.levelNames.slice();
  D.durations = [...new Set([...D.durations, ...(inc.durations || [])].map(Number))];
  return maps;
}

  if (!data || !Array.isArray(data.tasks)) { toast('That doesn’t look like a HatRack backup.'); return; }
  const isTemplate = data.kind === 'hatrack-setup' || (!data.tasks.length && (data.areas || []).length);
  const choice = await new Promise(res => {
    let done = false;
    const m = openModal(isTemplate ? {
      title: 'Apply setup template',
      body: `<p style="margin:0">This template has ${plural((data.areas || []).length, 'group')}, ${plural((data.types || []).length, 'task type')}, ${plural((data.priorities || []).length, 'priority', 'priorities')}, ${plural((data.statuses || []).length, 'status', 'statuses')} and ${plural((data.fields || []).length, 'custom field')}.</p><p>Applying adds anything you don’t have yet — matched by name — and keeps all your tasks.</p>`,
      foot: `<button class="btn" data-close>Cancel</button><button class="btn primary" data-c="merge">Apply setup</button>`, onClose: () => { if (!done) res(null); },
    } : {
      title: 'Restore backup',
      body: `<p style="margin:0">This backup has ${plural(data.tasks.length, 'task')} and ${plural((data.areas || []).length, 'group')}${data.files ? ` plus ${plural(Object.keys(data.files).length, 'stored file')}` : ''}.</p><p>Merge keeps what you have and adds anything missing (groups and types with the same name are combined). Replace swaps everything for the backup.</p>`,
      foot: `<button class="btn" data-close>Cancel</button><button class="btn" data-c="merge">Merge</button><button class="btn danger" data-c="replace">Replace everything</button>`, onClose: () => { if (!done) res(null); },
    });
    m.addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) { done = true; m.close(); res(b.dataset.c); } });
  });
  if (!choice) return;
  const files = data.files; delete data.files; delete data.kind;
  if (files) for (const [id, f] of Object.entries(files)) { try { const blob = await (await fetch(f.data)).blob(); await FileStore.put(id, { name: f.name, type: f.type, size: f.size, blob }); } catch (e) { } }
  mutate(isTemplate ? 'Apply setup' : 'Restore backup', () => {
    if (choice === 'replace') { D = migrate(data); normalizeData(); U.cursor = null; return; }
    const inc = migrate(data);
    const maps = mergeConfig(inc);
    reindex();
    const have = new Set(D.tasks.map(t => t.id)); let ord = maxOrder();
    inc.tasks.forEach(t => {
      if (have.has(t.id)) return;
      t.areaId = maps.areas.get(t.areaId) || null; t.typeId = maps.types.get(t.typeId) || null;
      t.priorityId = maps.priorities.get(t.priorityId) || null; t.statusId = maps.statuses.get(t.statusId) || null;
      if (t.custom) t.custom = Object.fromEntries(Object.entries(t.custom).map(([k, v]) => [maps.fields.get(k) || k, v]));
      t.order = ++ord; D.tasks.push(t);
    });
    normalizeData();
  });
  saveUI(); toast(isTemplate ? 'Setup applied' : choice === 'replace' ? 'Backup restored' : 'Backup merged', { undo: true });
}

/* ============ HatRack — app shell, keyboard, sample data, start-up ============ */

function isTypingTarget(el) { return !!el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)); }
function anyLayerOpen() { return !!(openMenuEl || $('#modal-root').children.length); }
function closeTopLayer() {
  if (closeMenu()) return true;
  const ms = $('#modal-root').children; if (ms.length) { ms[ms.length - 1].close(); return true; }
  if (!$('#drawer').hidden) { closeDrawer(); return true; }
  return false;
}
function unsortedCount() { const c = cur(); return D.tasks.filter(t => !isDone(t) && isRootTask(t) && (c ? t.areaId === c : !(t.areaId && A[t.areaId]))).length; }

function renderHeader() {
  $$('#views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === U.view)));
  $('#btn-settings').setAttribute('aria-pressed', String(U.view === 'settings'));
  const n = unsortedCount();
  $('#btn-triage').innerHTML = `Triage${n ? ` <span class="badge warn">${n}</span>` : ''}`;
  $('#btn-triage').title = n ? `Sort ${plural(n, 'unsorted task')} one at a time (T)` : 'Sort unsorted tasks one at a time (T)';
}
function renderView() {
  const v = U.view;
  if (v === 'list') renderList(); else if (v === 'outline') renderOutline(); else if (v === 'reports') renderReports(); else if (v === 'settings') renderSettings(); else renderBoard();
}
function renderAll() { renderHeader(); renderToolbar(); renderView(); renderSelBar(); if (editingId && !TASK[editingId]) closeDrawer(true); }
function setView(v) { U.view = v; saveUI(); closeMenu(); if (v === 'settings') closeDrawer(true); renderAll(); $('#view').scrollTo({ top: 0, left: 0 }); }

function applyTheme() {
  const r = document.documentElement;
  if (U.theme === 'light' || U.theme === 'dark') r.dataset.theme = U.theme; else delete r.dataset.theme;
  const b = $('#btn-theme'); if (b) b.title = `Theme: ${U.theme === 'auto' ? 'match my device' : U.theme} (click to change)`;
}

/* ---------- global keyboard ---------- */
function onGlobalKey(e) {
  if (e.key === 'Escape') { if (closeTopLayer()) { e.preventDefault(); return; } if (sel.size && !isTypingTarget(e.target)) { clearSel(); return; } if (isTypingTarget(e.target)) e.target.blur(); return; }
  if (triageOn || anyLayerOpen() || isTypingTarget(e.target)) return;
  const mod = e.metaKey || e.ctrlKey; const k = e.key.toLowerCase();
  if (mod && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if (mod && k === 'a' && (U.view === 'board' || U.view === 'list')) { e.preventDefault(); selectAllVisible(); return; }
  if (mod && k === 'd' && sel.size) { e.preventDefault(); duplicateSel(); return; }
  if (mod || e.altKey) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && sel.size) { e.preventDefault(); deleteSel(); return; }
  if (/^[1-9]$/.test(e.key) && sel.size && U.view === 'board') { e.preventDefault(); moveSelToCol(+e.key - 1); return; }
  if (e.target.closest?.('.card') && (e.key === 'Enter' || e.key === ' ')) return;
  if (k === 'n' || e.key === '/') { e.preventDefault(); $('#quick').focus(); return; }
  if (k === 'i') { e.preventDefault(); openImport(); return; }
  if (k === 't') { e.preventDefault(); openTriage(); return; }
  if (k === 'e') { e.preventDefault(); openExport(); return; }
  if (e.key === '?') { e.preventDefault(); openHelp(); return; }
  if (k === 'g') { e.preventDefault(); openGuide(); return; }
}
