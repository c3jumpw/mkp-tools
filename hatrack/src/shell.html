<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HatRack</title>
<meta name="description" content="HatRack — a lightweight visual sorter for entrepreneurs who wear many hats. Paste long to-do lists, sort them onto your businesses, projects and personal life, and export them to your task app.">
<meta name="theme-color" content="#1E6B52">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HatRack">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='28' height='3' rx='1.5' fill='%2364748B'/%3E%3Cpath d='M16 7v4' stroke='%2364748B' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M8 22c0-6 3.6-9.5 8-9.5s8 3.5 8 9.5z' fill='%231E6B52'/%3E%3Cellipse cx='16' cy='23' rx='12.5' ry='3.4' fill='%231E6B52'/%3E%3Cpath d='M8.4 19.4h15.2' stroke='%23D9961A' stroke-width='2.2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
/*__CSS__*/
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#" id="brand" aria-label="HatRack home">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
      <rect x="2" y="4" width="28" height="3" rx="1.5" fill="var(--muted)"/>
      <path d="M16 7v4" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 22c0-6 3.6-9.5 8-9.5s8 3.5 8 9.5z" fill="var(--accent)"/>
      <ellipse cx="16" cy="23" rx="12.5" ry="3.4" fill="var(--accent)"/>
      <path d="M8.4 19.4h15.2" stroke="var(--hl)" stroke-width="2.2"/>
    </svg>HatRack</a>
  <div class="seg" role="group" aria-label="View" id="views">
    <button data-view="board">Board</button><button data-view="list">List</button><button data-view="outline">Outline</button><button data-view="reports">Reports</button>
  </div>
  <form class="quick" id="quick-form" autocomplete="off">
    <input class="inp" id="quick" placeholder="Quick add — Call the accountant @Ledgerline !high ^fri ~15m" aria-label="Quick add a task (shortcuts work)">
  </form>
  <div class="top-actions">
    <button class="btn" id="btn-import" title="Paste or open a long list (I)">Import</button>
    <button class="btn" id="btn-triage">Triage</button>
    <button class="btn" id="btn-export" title="Export to Todoist, Asana, CSV, Markdown, calendar… (E)">Export</button>
    <button class="btn ghost" id="btn-settings" title="Groups, types, priorities, fields and backups">Configure</button>
    <button class="icon-btn" id="btn-help" aria-label="Help, visual guide and shortcuts" aria-haspopup="menu" title="Help, visual guide and shortcuts">?</button>
    <button class="icon-btn" id="btn-theme" aria-label="Switch theme"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/></svg></button>
  </div>
</header>
<div class="toolbar" id="toolbar"></div>
<main id="view" tabindex="-1"></main>
<div id="selbar" class="selbar" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Task details"></aside>
<div id="modal-root"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<noscript><p style="padding:20px">HatRack needs JavaScript turned on.</p></noscript>
<script>
/*__JS__*/
</script>
</body>
</html>
