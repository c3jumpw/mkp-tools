# =============================================================================
# wrangler.c1.toml — config for the OLD Worker on the c1.jumpw account
# =============================================================================
# PURPOSE
#   The server moved to the c3.jumpw Cloudflare account on 2026-11-22
#   (wrangler.toml). The old Worker on c1.jumpw stays up for a while:
#     - the old app address (c1jumpw.github.io/mkp-tools/mkp-dispatch/,
#       frozen at app v15 with a "moved" bar) still sends captures to it;
#     - it serves GET /admin/export, from which the new server copies the
#       history once (lib/migrate.js).
#   This file deploys the SAME code to the old Worker with the old
#   account's bindings. Cloudflare Workers Builds on the c1 account runs:
#     npx wrangler deploy --config wrangler.c1.toml
#   (root directory mkp-dispatch/worker, repo c3jumpw/mkp-tools).
#
# ASSUMPTIONS
#   - Secrets on the old Worker are untouched by deploys (CLICKUP_CLIENT_
#     SECRET, APP_PASSCODE, ADMIN_PASSCODE, GEMINI_API_KEY already set).
#   - Values here match what the old Worker ran before (wrangler.toml v6/
#     v8), except ALLOWED_ORIGIN also lists the new address so an admin on
#     dispatchit.mkcworkspace.com can switch off the old Worker's ClickUp
#     webhook once the new one is live.
#
# VERSION HISTORY
#   v1  2026-11-22  Created for the move to c3 (clickup-proxy.js v10).
#                    TODO: once nobody uses the old address (Activity on
#                    the old Worker shows no captures for a couple of
#                    weeks): disconnect its build in c1's dashboard, delete
#                    the c1 Worker, its KV namespace and Vectorize index,
#                    then delete this file and lib/migrate.js.
# =============================================================================

name = "dispatch-clickup-proxy"
main = "clickup-proxy.js"
compatibility_date = "2024-11-01"

[vars]
# Old address first (its devices still send captures here); the new
# address only for one-time admin clean-up calls. Exact origins, no slash.
ALLOWED_ORIGIN = "https://c1jumpw.github.io,https://dispatchit.mkcworkspace.com"

# Where "Connect to ClickUp" returns on the old Worker: the old copy.
APP_URL = "https://c1jumpw.github.io/mkp-tools/mkp-dispatch/"

# Same public values as wrangler.toml (see the comments there).
CLICKUP_CLIENT_ID = "CB58HH6R33DAM091WKD5OG4EO5NSWP0I"
WORKSPACE_ID = "25724879"
CHAT_CHANNEL_ID = "4-90170798185-8"
GEMINI_MODEL = "gemini-3.8-flash"
GEMINI_THINKING_LEVEL = "low"
GEMINI_EMBED_MODEL = "gemini-embedding-2"
EMBED_DIMS = "768"
PRIVATE_LIST_IDS = "901711853904"
# No MIGRATE_FROM here: the old Worker only exports, it never imports.

# The old account's KV namespace (holds the history being copied).
[[kv_namespaces]]
binding = "TOKEN_STORE"
id = "529827efc99e46b6aab8d32bb154edef"

# The old account's duplicate index.
[[vectorize]]
binding = "TASK_VECTORS"
index_name = "dispatch-tasks"

# Same 15-minute sync as before. TODO: remove with the old Worker; until
# then both Workers sync (only the old one's Gemini use is redundant).
[triggers]
crons = ["*/15 * * * *"]
